version: '3.8'

services:
  app:
    build: .
    ports:
      - "4444:4444"
    volumes:
      - uploads:/app/uploads
      - videos:/app/videos
      - dbdata:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4444/api/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  uploads:
  videos:
  dbdata: