<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f1a; --card-bg: #1a1a2e; --accent: #e94560;
            --accent-hover: #d63851; --accent-light: #ff6b8a; --text: #eaeaea; --text-muted: #888;
            --secondary: #16213e; --border: #2a2a4a;
            --danger: #dc3545;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 15px rgba(0,0,0,0.25);
            --shadow-lg: 0 8px 25px rgba(0,0,0,0.35);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.5);
        }
        [data-theme="light"] {
            --bg: #f5f5f7; --card-bg: #ffffff; --accent: #e94560;
            --accent-hover: #d63851; --accent-light: #ff6b8a; --text: #1a1a2e; --text-muted: #666;
            --secondary: #f0f0f3; --border: #ddd;
            --danger: #dc3545;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        
        header {
            background: linear-gradient(180deg, var(--card-bg), rgba(26,26,46,0.98));
            padding: 14px 24px; display: flex; align-items: center; gap: 24px;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-md);
        }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .theme-toggle { background: none; border: 1px solid var(--border); border-radius: var(--radius-xl); width: 40px; height: 40px; font-size: 18px; cursor: pointer; transition: all 0.2s; }
        .theme-toggle:hover { background: var(--secondary); }
        [data-theme="light"] header { background: linear-gradient(180deg, var(--card-bg), rgba(255,255,255,0.98)); box-shadow: var(--shadow-md); }
        [data-theme="light"] .theme-toggle { background: var(--border); }
        [data-theme="light"] .model-card { background: linear-gradient(145deg, var(--card-bg), var(--card-bg)); box-shadow: var(--shadow-md); }
        [data-theme="light"] .model-card::before { background: linear-gradient(180deg, rgba(233,69,96,0.08), transparent); }
        [data-theme="light"] .logo { -webkit-text-fill-color: var(--accent); background: none; color: var(--accent); }
        [data-theme="light"] .media-viewer { background: #000; }
        [data-theme="light"] .btn-primary { box-shadow: var(--shadow-md); }
        .search-box { flex: 1; max-width: 400px; }
        .search-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text); font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,69,96,0.15); }
        
        .btn { padding: 12px 20px; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; box-shadow: var(--shadow-md); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .btn-secondary { background: var(--secondary); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        
        .container { display: flex; min-height: calc(100vh - 65px); }
        .sidebar { width: 260px; background: var(--card-bg); padding: 20px; border-right: 1px solid var(--border); }
        .sidebar h3 { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .filter-list { display: flex; flex-direction: column; gap: 6px; }
        .filter-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px 14px; border-radius: var(--radius-md); font-size: 14px; transition: all 0.2s; }
.filter-item:hover { background: var(--secondary); }
        .filter-item.active { background: var(--accent); }
        .main { flex: 1; padding: 24px; }
        
.models-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .model-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl); padding: 0;
            display: flex; flex-direction: column;
            transition: all 0.3s ease; border: 1px solid var(--border);
            overflow: hidden; cursor: pointer;
        }
        .model-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(233,69,96,0.25); border-color: var(--accent); }
        .card-cover { position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--bg); }
        .card-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .model-card:hover .card-cover img { transform: scale(1.08); }
        .card-cover .empty-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 56px; background: linear-gradient(135deg, var(--secondary), var(--bg)); }
        
        .card-info { padding: 20px; }
        .card-header { display: flex; align-items: center; gap: 14px; }
        .card-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); flex-shrink: 0; box-shadow: var(--shadow-md); }
        .card-avatar-placeholder { width: 52px; height: 52px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; border: 3px solid var(--border); font-size: 24px; }
        .card-title { flex: 1; min-width: 0; }
        .card-name { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
        .card-category { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .card-tag { background: rgba(233,69,96,0.15); color: var(--accent); padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 500; border: 1px solid rgba(233,69,96,0.3); }
        .card-stats { display: flex; gap: 16px; margin-top: 14px; font-size: 13px; color: var(--text-muted); }
        .card-stats span { display: flex; align-items: center; gap: 6px; background: var(--bg); padding: 6px 12px; border-radius: 20px; }
        .card-actions { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--bg); }
        .card-actions .btn { flex: 1; justify-content: center; }
        .model-media { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; position: relative; z-index: 1; width: 100%; cursor: pointer; }
        .media-thumb { width: 80px; height: 80px; border-radius: var(--radius-sm); object-fit: cover; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; }
        .media-thumb:hover { border-color: var(--accent); transform: scale(1.05); }
        .video-icon { width: 80px; height: 80px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; background: var(--secondary); border: 2px solid var(--border); font-size: 24px; cursor: pointer; }
        .media-count { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .model-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: 8px; position: relative; z-index: 1; }
        .model-stats span { display: flex; align-items: center; gap: 4px; }
        
        .video-size { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.7); padding: 2px 4px; border-radius: 4px; font-size: 10px; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; padding: 16px; }
        .pagination button { background: var(--secondary); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: var(--radius-md); cursor: pointer; }
        .pagination button:hover { background: var(--accent); }
        .pagination span { padding: 8px 12px; }
        .sort-bar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 16px; }
        .sort-bar button { background: var(--secondary); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; font-size: 12px; }
        .sort-bar button.active { background: var(--accent); border-color: var(--accent); }
        .fullscreen-viewer { position: fixed; inset: 0; background: #000; z-index: 500; display: none; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
        .fullscreen-viewer.active { display: flex; }
        .fullscreen-viewer img, .fullscreen-viewer video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .fullscreen-close { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; font-size: 32px; color: #fff; cursor: pointer; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; }
        .fullscreen-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: #fff; font-size: 28px; cursor: pointer; }
        .fullscreen-nav.prev { left: 20px; }
        .fullscreen-nav.next { right: 20px; }
        .fullscreen-counter { position: absolute; bottom: 20px; color: #fff; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; }
        .model-actions { display: flex; gap: 10px; margin-top: 8px; position: relative; z-index: 1; }
        .model-actions .btn { box-shadow: var(--shadow-sm); }
        .model-actions .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 64px; opacity: 0.3; }
        
        .modal-overlay { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 200; padding: 0; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border-radius: 0; padding: 0; width: 100%; max-width: 100%; max-height: 100vh; overflow-y: auto; border: none; box-shadow: none; }
        .modal::-webkit-scrollbar { width: 8px; }
        .modal::-webkit-scrollbar-track { background: var(--bg); }
        .modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .modal::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        .modal h2 { margin-bottom: 28px; font-size: 26px; font-weight: 700; }
        .model-detail { padding: 24px; }
        .model-detail h2 { margin: 20px 0; font-size: 28px; font-weight: 700; }
        .close-modal-btn { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; font-size: 28px; background: var(--secondary); border: 1px solid var(--border); border-radius: 50%; cursor: pointer; z-index: 10; transition: all 0.2s; }
        .close-modal-btn:hover { background: var(--accent); color: #fff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .form-group input[type="text"], .form-group input[type="file"] { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text); font-size: 14px; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(233,69,96,0.2); }
        
        .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .upload-zone:hover { border-color: var(--accent); background: rgba(233,69,96,0.05); }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 32px; }
        .upload-text { color: var(--text-muted); font-size: 14px; }
        .upload-text small { display: block; margin-top: 4px; font-size: 12px; }
        .file-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .file-item { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--secondary); border-radius: var(--radius-sm); font-size: 13px; max-width: 200px; }
        .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
        .file-item button:hover { color: var(--accent); }
        
        .tags-input-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); min-height: 48px; }
        .tags-input-container input { border: none; background: transparent; flex: 1; min-width: 100px; }
        .tags-input-container input:focus { outline: none; border: none; box-shadow: none; }
        .tag-chip { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); padding: 6px 12px; border-radius: var(--radius-lg); font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .tag-chip button { background: none; border: none; color: white; cursor: pointer; font-size: 16px; }
        
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .section-title { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .section-title span { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .media-viewer { position: fixed; inset: 0; background: #000; z-index: 300; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .media-viewer.active { display: flex; }
        .media-viewer-content { max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center; }
        .media-viewer-content img, .media-viewer-content video { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .media-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .media-viewer-nav:hover { background: rgba(255,255,255,0.2); }
        .media-viewer-nav.prev { left: 20px; }
        .media-viewer-nav.next { right: 20px; }
        .media-viewer .close { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; font-size: 28px; color: white; cursor: pointer; background: rgba(255,255,255,0.1); border: none; border-radius: var(--radius-xl); transition: all 0.2s; z-index: 10; }
        .media-viewer .close:hover { background: var(--accent); }
        .media-viewer-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: var(--radius-lg); }
        
        .model-detail { text-align: center; max-width: 800px; margin: 0 auto; }
        .model-detail h2 { margin: 16px 0; font-size: 28px; font-weight: 700; }
        .detail-header { position: relative; padding-top: 24px; margin-bottom: 24px; text-align: center; }
        .detail-avatar { width: 250px; height: 250px; margin: 0 auto 24px; border-radius: 50%; overflow: hidden; border: 4px solid var(--accent); box-shadow: var(--shadow-lg); cursor: pointer; }
        .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
        .detail-section { margin: 32px 0; text-align: left; background: var(--bg); border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border); }
        .detail-section h3 { font-size: 16px; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .detail-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .detail-gallery img { width: 100%; aspect-ratio: 1; border-radius: var(--radius-md); object-fit: cover; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .detail-gallery img:hover { border-color: var(--accent); transform: scale(1.02); }
        
        .detail-view { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); }
        .detail-content { flex: 1; overflow-y: auto; padding: 32px; max-width: 900px; margin: 0 auto; width: 100%; }
        .detail-info { text-align: center; margin-bottom: 40px; }
        .detail-avatar { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); margin: 0 auto 20px; box-shadow: var(--shadow-lg); }
        .detail-info h2 { font-size: 32px; font-weight: 800; margin-bottom: 16px; letter-spacing: -0.5px; }
        .detail-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .detail-tags .tag { background: rgba(233,69,96,0.15); color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; border: 1px solid rgba(233,69,96,0.3); }
        .detail-category { display: inline-block; background: var(--accent); color: white; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-description { color: var(--text); font-size: 15px; line-height: 1.6; margin: 20px 0; padding: 20px; background: var(--bg); border-radius: var(--radius-lg); border-left: 4px solid var(--accent); }
        .detail-meta { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .detail-meta span { display: flex; align-items: center; gap: 8px; background: var(--card-bg); padding: 10px 20px; border-radius: 30px; font-size: 15px; border: 1px solid var(--border); }
        .detail-social { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .social-link { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; color: var(--text); text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .social-link:hover { background: var(--accent); border-color: var(--accent); color: white; }
        .detail-section { margin: 40px 0; background: var(--card-bg); border-radius: var(--radius-xl); padding: 24px; border: 1px solid var(--border); }
        .detail-section h3 { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .detail-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .detail-gallery img { width: 100%; aspect-ratio: 1; border-radius: var(--radius-lg); object-fit: cover; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .detail-gallery img:hover { border-color: var(--accent); transform: scale(1.03); box-shadow: var(--shadow-md); }
        .detail-gallery.videos { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .video-card { position: relative; border-radius: var(--radius-lg); overflow: hidden; }
        .video-card video { width: 100%; border-radius: var(--radius-lg); }
        .video-card .video-size { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; }
        .detail-actions { display: flex; gap: 16px; justify-content: center; padding: 32px; border-top: 1px solid var(--border); background: var(--card-bg); }
        .detail-actions .btn { padding: 14px 32px; font-size: 15px; }
        .detail-gallery video { width: 100%; aspect-ratio: 1; border-radius: var(--radius-md); object-fit: cover; cursor: pointer; border: 2px solid var(--border); }
        .detail-gallery .video-thumb { aspect-ratio: 1; border-radius: var(--radius-md); background: var(--secondary); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; font-size: 36px; transition: all 0.2s; }
        .detail-gallery .video-thumb:hover { border-color: var(--accent); transform: scale(1.02); }
        .detail-gallery .video-thumb span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; max-width: 120px; padding: 0 8px; }
        
        @media (max-width: 768px) {
            header { flex-wrap: wrap; gap: 12px; }
            .search-box { order: 3; max-width: 100%; width: 100%; }
            .sidebar { display: none; }
            .models-grid { grid-template-columns: 1fr; }
            .modal { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Model Catalog</div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">🌙</button>
        <div class="search-box"><input type="text" id="search" placeholder="Поиск..."></div>
        <div class="sort-bar">
            <button onclick="setSort('')" id="sort-default">↓</button>
            <button onclick="setSort('name')" id="sort-name">A-Z</button>
            <button onclick="setSort('created_at')" id="sort-date">📅</button>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ Добавить</button>
    </header>

    <div class="container">
        <aside class="sidebar"><h3>Теги</h3><div class="filter-list" id="filters"></div></aside>
        <main class="main"><div class="models-grid" id="modelsGrid"></div></main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
    <div class="modal-overlay" id="confirmOverlay">
        <div class="modal">
            <h2>Подтверждение</h2>
            <p>Удалить модель?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeConfirm()">Отмена</button>
                <button class="btn btn-danger" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>
    <div class="media-viewer" id="mediaViewer">
        <button class="close" onclick="closeViewer()">×</button>
        <div class="media-viewer-content" id="viewerContent"></div>
        <button class="media-viewer-nav prev" onclick="navPrev()">❮</button>
        <button class="media-viewer-nav next" onclick="navNext()">❯</button>
        <div class="media-viewer-counter" id="viewerCounter"></div>
    </div>
    <div class="fullscreen-viewer" id="fullscreenViewer">
        <button class="fullscreen-close" onclick="closeFullscreen()">×</button>
        <button class="fullscreen-nav prev" onclick="event.stopPropagation();fsPrev()">❮</button>
        <button class="fullscreen-nav next" onclick="event.stopPropagation();fsNext()">❯</button>
        <div class="fullscreen-content" id="fullscreenContent"></div>
        <div class="fullscreen-counter" id="fullscreenCounter"></div>
    </div>

    <script>
        window.onload = function() {
            initApp();
        };

        function initApp() {
            window.currentFilter = '';
            window.editingId = null;
            window.allTags = [];
            window.existingPhotos = [];
            window.existingVideos = [];
            window.newPhotos = [];
            window.newVideos = [];
            window.currentSort = '';
            window.currentPage = 1;
            window.totalPages = 1;
            window.$ = id => document.getElementById(id);
            
            window.toggleTheme = toggleTheme;
            window.openModal = openModal;
            window.closeModal = closeModal;
            window.confirmDelete = confirmDelete;
            window.closeConfirm = closeConfirm;
            window.save = save;
            window.filter = filter;
            window.setPage = setPage;
            window.setSort = setSort;
            window.viewModel = viewModel;
            window.openFullscreen = openFullscreen;
            window.closeFullscreen = closeFullscreen;
            window.fsPrev = fsPrev;
            window.fsNext = fsNext;
            window.viewMedia = viewMedia;
            
            loadModels();
            loadTags();
        }
        
        function toggleTheme() {
            const html = document.documentElement;
            const isLight = html.getAttribute('data-theme') === 'light';
            html.setAttribute('data-theme', isLight ? 'dark' : 'light');
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
        }
        
        (() => {
            const saved = localStorage.getItem('theme');
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
        
        async function viewModel(id) {
            const m = await (await fetch('/api/models/' + id)).json();
            if (!m) return;
            
            const photos = m.photos || [];
            const videos = m.videos || [];
            const mediaList = [...photos.map(p => '/uploads/' + p.name), ...videos.map(v => '/videos/' + v.name)];
            
            $('modalOverlay').classList.add('active');
            const avatarSrc = m.avatar ? '/uploads/' + m.avatar : '';
            const dateStr = m.created_at ? new Date(m.created_at).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'}) : '';
            $('modalContent').innerHTML = `
                <button class="close-modal-btn" onclick="closeModal()">×</button>
                <div class="detail-view">
                    <div class="detail-content">
                        <div class="detail-info">
                            ${avatarSrc ? `<img src="${avatarSrc}" class="detail-avatar" onclick="event.stopPropagation();openFullscreen('${avatarSrc}')">` : ''}
                            <h2>${escapeHtml(m.name)}</h2>
                            ${m.category ? `<div class="detail-category">${escapeHtml(m.category)}</div>` : ''}
                            <div class="detail-tags">${m.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
                            ${m.description ? `<div class="detail-description">${escapeHtml(m.description)}</div>` : ''}
                            <div class="detail-meta">
                                <span>📷 ${photos.length} фото</span>
                                <span>🎬 ${videos.length} видео</span>
                            </div>
                            ${m.social_links && m.social_links.length > 0 ? `
                            <div class="detail-social">
                                ${m.social_links.map(s => `<a href="${s.url}" target="_blank" class="social-link">${s.label}</a>`).join('')}
                            </div>
                            ` : ''}
                        </div>
                        
                        ${photos.length > 0 ? `
                        <div class="detail-section">
                            <h3>Фото</h3>
                            <div class="detail-gallery">
                                ${photos.map((p, i) => `<img src="/uploads/${p.name}" onclick="event.stopPropagation();openFullscreen('/uploads/${p.name}', ${JSON.stringify(mediaList)})">`).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${videos.length > 0 ? `
                        <div class="detail-section">
                            <h3>Видео</h3>
                            <div class="detail-gallery videos">
                                ${videos.map((v, i) => `<div class="video-card"><video src="/videos/${v.name}" controls playsinline></video><span class="video-size">${formatSize(v.size)}</span></div>`).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="detail-actions">
                            <button class="btn btn-secondary" onclick="closeModal();openById(${m.id})">✏️ Редактировать</button>
                            <button class="btn btn-danger" onclick="closeModal();confirmDelete(${m.id})">🗑️ Удалить</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadModels() {
            const params = new URLSearchParams();
            const search = $('search').value;
            if (search) params.set('search', search);
            if (currentFilter) params.set('tag', currentFilter);
            if (currentSort) params.set('sort', currentSort);
            if (currentPage > 1) params.set('page', currentPage);
            
            const res = await fetch('/api/models' + (params ? '?' + params : ''));
            const r = await res.json();
            renderModels(r.data || r);
            renderPagination(r);
        }

        let currentSort = '', currentPage = 1, totalPages = 1;

        async function loadTags() {
            allTags = await (await fetch('/api/tags')).json();
            renderFilters();
        }

        function formatSize(bytes) {
            if (!bytes) return '0 МБ';
            const mb = bytes / (1024 * 1024);
            return mb.toFixed(1) + ' МБ';
        }

        function renderModels(models) {
            $('modelsGrid').innerHTML = models.length 
                ? models.map(m => {
                    const photos = m.photos || [];
                    const videos = m.videos || [];
                    const totalPhotos = photos.length;
                    const totalVideos = videos.length;
                    const totalMedia = totalPhotos + totalVideos;
                    const cover = photos[0] ? '/uploads/' + photos[0].name : (videos[0] ? '/videos/' + videos[0].name : null);
                    return `
                    <div class="model-card" onclick="viewModel(${m.id})">
                        <div class="card-cover">
                            ${cover ? `<img src="${cover}">` : '<div class="empty-cover">👤</div>'}
                        </div>
                        <div class="card-info">
                            <div class="card-header">
                                ${m.avatar ? `<img src="/uploads/${m.avatar}" class="card-avatar">` : '<div class="card-avatar-placeholder">👤</div>'}
                                <div class="card-title">
                                    <div class="card-name">${escapeHtml(m.name)}</div>
                                    ${m.category ? `<div class="card-category">${escapeHtml(m.category)}</div>` : ''}
                                    <div class="card-tags">${m.tags.slice(0,3).map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('')}</div>
                                </div>
                            </div>
                            ${totalMedia > 0 ? `
                            <div class="card-stats">
                                <span>📷 ${totalPhotos} фото</span>
                                <span>🎬 ${totalVideos} видео</span>
                            </div>
                            ` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-secondary" onclick="event.stopPropagation();openById(${m.id})">✏️ Изменить</button>
                            <button class="btn btn-danger" onclick="event.stopPropagation();confirmDelete(${m.id})">🗑️</button>
                        </div>
                    </div>
                `}).join('')
                : '<div class="empty"><div class="empty-icon">👤</div>Нет моделей</div>';
        }

        function renderPagination(r) {
            if (!r || r.pages <= 1) return;
            totalPages = r.pages;
            let html = `<div class="pagination">`;
            if (r.page > 1) html += `<button onclick="setPage(1)">«</button> <button onclick="setPage(${r.page - 1})">‹</button>`;
            html += `<span>${r.page} / ${r.pages}</span>`;
            if (r.page < r.pages) html += `<button onclick="setPage(${r.page + 1})">›</button> <button onclick="setPage(${r.pages})">»</button>`;
            html += `</div>`;
            $('modelsGrid').insertAdjacentHTML('afterend', html);
        }

        function setPage(p) { currentPage = p; loadModels(); }
        function setSort(s) { currentSort = s; currentPage = 1; loadModels(); }

        function renderFilters() {
            $('filters').innerHTML = `
                <label class="filter-item ${!currentFilter?'active':''}" onclick="filter('')">
                    <input type="radio" name="f" ${!currentFilter?'checked':''}>Все
                </label>
                ${allTags.map(t => `
                    <label class="filter-item ${currentFilter===t?'active':''}" onclick="filter(&quot;${escapeHtml(t)}&quot;)">
                        <input type="radio" name="f" ${currentFilter===t?'checked':''}>${escapeHtml(t)}
                    </label>
                `).join('')}`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        
        function filter(tag) { currentFilter = tag; loadModels(); }

        async function openById(id) {
            const m = await (await fetch('/api/models/' + id)).json();
            openModal(m);
        }

        function openModal(model = null) {
            window.editingId = model?.id || null;
            window.existingPhotos = model?.photos || [];
            window.existingVideos = model?.videos || [];
            window.newPhotos = []; window.newVideos = [];

            $('modalOverlay').classList.add('active');
            $('modalContent').innerHTML = `
                <h2>${model?'Редактирование':'Добавление'} модели</h2>
                <form onsubmit="save(event)">
                    <div class="form-group"><label>Имя *</label><input name="name" value="${model?.name||''}" required></div>
                    
                    <div class="form-group">
                        <div class="section-title"><span>Аватар</span></div>
                        <label class="upload-zone">
                            <input type="file" id="avatarInput" name="avatar" accept="image/*" onchange="previewAvatar()" style="display:none">
                            <div class="upload-icon">📷</div><div class="upload-text">Нажмите для фото</div>
                        </label>
                        <div class="file-list" id="avatarPreview">${model?.avatar?`<span class="file-item">${model.avatar}</span>`:''}</div>
                    </div>

                    <div class="form-group">
                        <div class="section-title"><span>Фото</span><small>до 10</small></div>
                        <label class="upload-zone">
                            <input type="file" id="photosInput" name="photos" accept="image/*" multiple onchange="previewPhotos()" style="display:none">
                            <div class="upload-icon">🖼️</div><div class="upload-text">Добавить фото</div>
                        </label>
                        <div class="file-list" id="photosPreview"></div>
                    </div>

                    <div class="form-group">
                        <div class="section-title"><span>Видео</span><small>до 10</small></div>
                        <label class="upload-zone">
                            <input type="file" id="videosInput" name="videos" multiple onchange="previewVideos()" style="display:none">
                            <div class="upload-icon">🎬</div><div class="upload-text">Добавить видео</div>
                        </label>
                        <div class="file-list" id="videosPreview"></div>
                    </div>

                    <div class="form-group">
                        <label>Описание</label>
                        <textarea name="description" rows="3" style="width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font-size:14px;resize:vertical;">${model?.description||''}</textarea>
                    </div>

                    <div class="form-group">
                        <label>Категория</label>
                        <input type="text" name="category" value="${model?.category||''}" placeholder="Например: Голосование, Актриса..." style="width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font-size:14px;">
                    </div>

                    <div class="form-group">
                        <label>Соц. сети (JSON)</label>
                        <input type="text" name="social_links" value='${JSON.stringify(model?.social_links || []).replace(/'/g, "&apos;")}' placeholder='[{"label":"Telegram","url":"..."}]' style="width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font-size:14px;">
                    </div>

                    <div class="form-group">
                        <label>Теги</label>
                        <div class="tags-input-container" id="tagsContainer">
                            ${(model?.tags||[]).map(t => `<span class="tag-chip" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<button onclick="this.parentElement.remove()">×</button></span>`).join('')}
                            <input id="tagInput" placeholder="Enter для тега">
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            `;
            updateFileLists();
            
            $('tagInput').onkeydown = e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const v = e.target.value.trim().toLowerCase();
                    if (v && !$('[data-tag="'+v+'"]')) {
                        const c = document.createElement('span');
                        c.className = 'tag-chip'; c.setAttribute('data-tag',v);
                        c.innerHTML = v + '<button onclick="this.parentElement.remove()">×</button>';
                        $('tagsContainer').insertBefore(c, e.target);
                        e.target.value = '';
                    }
                }
            };

            }

        function previewAvatar() {
            $('avatarPreview').innerHTML = $('avatarInput').files[0] 
                ? `<span class="file-item">${$('avatarInput').files[0].name}</span>` : '';
        }

        function previewPhotos() {
            window.newPhotos = [...$('photosInput').files].map(f=>f.name); 
            updateFileLists();
        }

        function previewVideos() {
            window.newVideos = [...$('videosInput').files].map(f=>f.name); 
            updateFileLists();
        }

        function updateFileLists() {
            const render = (arr, type) => arr.map((f, i) => 
                `<span class="file-item" title="${f}"><span>${f}</span><button onclick="removeFile('${type}',${i})">×</button><input name="existing_${type}" value="${f}"></span>`
            ).join('');
            $('photosPreview').innerHTML = render((window.existingPhotos || []).concat(window.newPhotos || []), 'photos');
            $('videosPreview').innerHTML = render((window.existingVideos || []).concat(window.newVideos || []), 'videos');
        }

        function removeFile(type, index) {
            if (type === 'photos') {
                if (index < (window.existingPhotos || []).length) {
                    window.existingPhotos.splice(index, 1);
                } else {
                    window.newPhotos.splice(index - (window.existingPhotos || []).length, 1);
                }
            } else {
                if (index < (window.existingVideos || []).length) {
                    window.existingVideos.splice(index, 1);
                } else {
                    window.newVideos.splice(index - (window.existingVideos || []).length, 1);
                }
            }
            updateFileLists();
        }

        function closeModal() {
            $('modalOverlay').classList.remove('active');
            window.editingId = null;
        }

        function openViewer(src, list, isVideo = false) {
            if (list) {
                mediaList = list;
            } else {
                mediaList = [src];
            }
            mediaIndex = mediaList.indexOf(src);
            showMedia(isVideo);
            $('mediaViewer').classList.add('active');
        }

        function showMedia(isVideo) {
            const src = mediaList[mediaIndex];
            $('viewerContent').innerHTML = isVideo 
                ? `<video controls autoplay><source src="${src}"></video>` 
                : `<img src="${src}">`;
            $('viewerCounter').textContent = mediaList.length > 1 ? `${mediaIndex + 1} / ${mediaList.length}` : '';
        }

        function navPrev() {
            if (mediaList.length > 1) {
                mediaIndex = (mediaIndex - 1 + mediaList.length) % mediaList.length;
                const isVideo = mediaList[mediaIndex].match(/\.(mp4|webm|mov|avi)$/i);
                showMedia(isVideo);
            }
        }

        function navNext() {
            if (mediaList.length > 1) {
                mediaIndex = (mediaIndex + 1) % mediaList.length;
                const isVideo = mediaList[mediaIndex].match(/\.(mp4|webm|mov|avi)$/i);
                showMedia(isVideo);
            }
        }

        function closeViewer() {
            $('mediaViewer').classList.remove('active');
            $('viewerContent').innerHTML = '';
            mediaList = [];
        }

        let fsList = [], fsIndex = 0;
        function openFullscreen(src, list) {
            fsList = list || [src];
            fsIndex = fsList.indexOf(src);
            showFullscreen();
            $('fullscreenViewer').classList.add('active');
        }

        function showFullscreen() {
            const src = fsList[fsIndex];
            const isVideo = src.match(/\.(mp4|webm|mov|avi)$/i);
            $('fullscreenContent').innerHTML = isVideo 
                ? `<video controls autoplay><source src="${src}"></video>` 
                : `<img src="${src}">`;
            $('fullscreenCounter').textContent = fsList.length > 1 ? `${fsIndex + 1} / ${fsList.length}` : '';
        }

        function fsPrev() {
            fsIndex = (fsIndex - 1 + fsList.length) % fsList.length;
            showFullscreen();
        }

        function fsNext() {
            fsIndex = (fsIndex + 1) % fsList.length;
            showFullscreen();
        }

        function closeFullscreen() {
            $('fullscreenViewer').classList.remove('active');
            $('fullscreenContent').innerHTML = '';
            fsList = [];
        }

        async function viewMedia(id, index = 0) {
            const m = await (await fetch('/api/models/' + id)).json();
            const photos = m.photos || [];
            const videos = m.videos || [];
            const list = [...photos.map(p => '/uploads/' + p.name), ...videos.map(v => '/videos/' + v.name)];
            openFullscreen(list[index], list);
        }

        document.addEventListener('keydown', e => {
            if ($('fullscreenViewer').classList.contains('active')) {
                if (e.key === 'ArrowLeft') fsPrev();
                if (e.key === 'ArrowRight') fsNext();
                if (e.key === 'Escape') closeFullscreen();
                return;
            }
            if (!$('mediaViewer').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') navPrev();
            if (e.key === 'ArrowRight') navNext();
            if (e.key === 'Escape') closeViewer();
        });

        $('fullscreenViewer').addEventListener('click', e => {
            if (e.target.classList.contains('fullscreen-nav')) return;
            closeFullscreen();
        });

        async function save(e) {
            e.preventDefault();
            const form = new FormData(e.target);
            
            const tagElems = $('tagsContainer').querySelectorAll('[data-tag]');
            const tags = Array.from(tagElems).map(c => c.getAttribute('data-tag'));
            form.set('tags', JSON.stringify(tags));

            const url = window.editingId ? `/api/models/${window.editingId}` : '/api/models';
            await fetch(url, { method: window.editingId ? 'PUT' : 'POST', body: form });
            closeModal();
            loadModels(); loadTags();
        }

        function confirmDelete(id) {
            $('confirmOverlay').classList.add('active');
            $('confirmDelete').onclick = async () => {
                await fetch(`/api/models/${id}`, { method: 'DELETE' });
                closeConfirm();
                loadModels(); loadTags();
            };
        }

        function closeConfirm() { $('confirmOverlay').classList.remove('active'); }

        $('search').oninput = debounce(loadModels, 300);
        function debounce(fn, w) { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), w); }; }
    </script>
</body>
</html>
